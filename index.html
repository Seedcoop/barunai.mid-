<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>바른AI 챗봇 만들기 - 중등 실습</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body class="app-locked">
    <div class="page-glow"></div>
    <section id="gateOverlay" class="gate-overlay" aria-live="polite">
      <div class="gate-card">
        <p class="gate-step">0단계</p>
        <h2>실습 시작 코드 입력</h2>
        <p>수업용 입장 코드를 입력하면 웹앱이 활성화됩니다.</p>
        <div class="gate-form">
          <input id="gateCodeInput" type="password" placeholder="입장 코드 입력" autocomplete="off" />
          <button id="gateUnlockBtn" class="btn btn-primary" type="button">앱 시작하기</button>
        </div>
        <p id="gateMessage" class="gate-message">코드를 입력해 주세요.</p>
      </div>
    </section>
    <section id="cardUnlockModal" class="modal-overlay hidden" aria-live="polite" aria-modal="true" role="dialog">
      <div class="modal-card">
        <div class="modal-heading">
          <h2>카드 추가</h2>
          <button id="cardUnlockCloseBtn" class="icon-btn" type="button" aria-label="닫기">×</button>
        </div>
        <div class="modal-form">
          <input id="cardUnlockCodeInput" type="password" placeholder="암호 입력" autocomplete="off" />
          <button id="cardUnlockBtn" class="btn btn-primary" type="button">확인</button>
        </div>
        <p id="cardUnlockMessage" class="modal-message"></p>
      </div>
    </section>
    <div class="app-shell">
      <header class="top-bar">
        <div class="brand">바른AI</div>
        <div class="title-wrap">
          <h1>챗봇 만들기</h1>
        </div>
        <div class="top-actions">
          <p id="sessionChip" class="session-chip">입장 전</p>
        </div>
      </header>

      <nav class="tab-nav" aria-label="페이지 탭">
        <button id="tabPracticeBtn" class="tab-btn active" type="button">Q&A 실습</button>
        <button id="tabGuideBtn" class="tab-btn" type="button">윤리 가이드 문서</button>
      </nav>

      <main id="tabPracticePage" class="workspace tab-page active">
        <section class="panel left-panel compact-panel">
          <div class="panel-heading">
            <h2>Q&A 카드</h2>
            <div class="heading-actions">
              <button id="addCardBtn" class="btn btn-primary" type="button">카드 추가</button>
              <button id="resetBtn" class="btn btn-outline" type="button">실습 초기화</button>
            </div>
          </div>

          <div id="qnaList" class="qna-list" aria-live="polite"></div>

          <p id="statusText" class="status-text" role="status">준비 완료. 질문을 보내 보세요.</p>
        </section>

        <section class="panel right-panel">
          <div class="panel-heading">
            <h2>미리보기</h2>
          </div>

          <section id="roundControlBox" class="round-box hidden" aria-live="polite">
            <div id="roundUnlockPanel" class="round-unlock hidden">
              <div>
                <h3>암호 입력</h3>
              </div>
              <div class="round-code-form">
                <input id="roundCodeInput" type="password" placeholder="암호 입력" autocomplete="off" />
                <button id="roundUnlockBtn" class="btn btn-outline" type="button">열기</button>
              </div>
              <p id="roundCodeMessage" class="round-code-message"></p>
            </div>
          </section>

          <div class="progress-box">
            <p class="progress-title">응답 변화 단계</p>
            <p id="progressStageLabel" class="progress-stage">초기 응답 패턴</p>
            <div class="progress-track">
              <div id="progressFill" class="progress-fill"></div>
            </div>
          </div>

          <div id="chatWindow" class="chat-window" aria-live="polite"></div>

          <div class="chat-input-wrap">
            <input id="chatInput" type="text" placeholder="질문 입력하기..." />
            <button id="sendBtn" class="btn btn-primary" type="button">질문 보내기</button>
          </div>

          <section class="diagnosis-box">
            <h3>마지막 응답 진단</h3>
            <div id="responseMetrics" class="metrics-grid">
              <article class="metric-card">
                <p class="metric-title">편향 위험</p>
                <p id="biasMetric" class="metric-value">-</p>
              </article>
              <article class="metric-card">
                <p class="metric-title">환각 위험</p>
                <p id="hallucinationMetric" class="metric-value">-</p>
              </article>
              <article class="metric-card">
                <p class="metric-title">근거성</p>
                <p id="groundingMetric" class="metric-value">-</p>
              </article>
            </div>
            <ul id="responseNotes" class="feedback-list"></ul>
          </section>
        </section>
      </main>

      <main id="tabGuidePage" class="guide-page tab-page">
        <section class="panel guide-panel">
          <div class="panel-heading">
            <h2>윤리 가이드 문서</h2>
          </div>

          <section class="guide-box guide-box-full">
            <div class="guide-heading">
              <h3>지침 카드</h3>
            </div>

            <div id="guideCardList" class="guide-card-list" aria-live="polite"></div>
            <p id="guideSaveStatus" class="guide-save-status">아직 저장되지 않았습니다.</p>
          </section>
        </section>
      </main>
    </div>

    <script src="./gate-config.js"></script>
    <script src="./app.js"></script>
  </body>
</html>
